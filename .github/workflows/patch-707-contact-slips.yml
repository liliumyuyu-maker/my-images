name: Verify and deploy 707 shirt tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-707-contact-slips.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add flexible teacher and family order rows
        run: python .github/scripts/add_707_teacher_family_rows.py
      - name: Avoid full student-list rerenders while editing
        run: python .github/scripts/fix_707_student_card_updates.py
      - name: Apply emergency syntax hotfix if needed
        run: python .github/scripts/fix_707_syntax.py
      - name: Verify page JavaScript parses
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('707-shirt/index.html').read_text(encoding='utf-8')
          js = html.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/707-tool.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/707-tool.js
      - name: Commit verified update if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 707-shirt/index.html
          git diff --cached --quiet || git commit -m "fix: keep student card stable while editing orders"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./707-shirt
      - id: deployment
        uses: actions/deploy-pages@v4
