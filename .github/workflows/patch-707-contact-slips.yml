name: Patch 707 contact slips

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-707-contact-slips.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch 707 tool
        run: python .github/scripts/patch_707_contact.py
      - name: Commit patched tool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 707-shirt/index.html
          git diff --cached --quiet || git commit -m "feat: add contact-book confirmation slips and privacy-safe size refs"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./707-shirt
      - id: deployment
        uses: actions/deploy-pages@v4
