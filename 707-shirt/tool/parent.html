<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244b78"><title>班服小管家｜家長查詢</title><style>:root{--navy:#244b78;--ink:#243247;--muted:#6f7b8c;--line:#d9e3ef;--bg:#f5f8fc;--green:#21745c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:860px;margin:auto;padding:14px 14px 70px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#17385f,#2f659c 60%,#7ca9d3)}h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;opacity:.92}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0}.card h2{margin:0 0 10px;color:var(--navy);font-size:20px}.note{padding:10px 12px;border-left:4px solid #7aa5d1;border-radius:9px;background:#f1f7fd;font-size:13px;line-height:1.55}.note.good{border-left-color:#6eaa91;background:#f3fbf7}.note.warn{border-left-color:#dfa24d;background:#fff8ec}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}input{width:100%;min-height:46px;border:1px solid #cad7e6;border-radius:9px;padding:8px;font-size:16px;background:#fff}.btn{border:0;border-radius:10px;min-height:46px;padding:9px 13px;background:var(--navy);color:#fff;font-weight:800;margin-top:10px}.result{padding:14px;border-radius:13px;background:#f5f9fe;border:1px solid #d6e3f1;margin-top:10px;min-height:80px}.result b{font-size:22px;color:var(--navy)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:9px;border-bottom:1px solid #e8eef5;text-align:left;font-size:13px;vertical-align:top}th{background:#eef4fb;color:#244b78}.updated{text-align:right;color:var(--muted);font-size:11px;margin-top:8px}.total{font-size:28px;font-weight:900;color:var(--navy)}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><section class="hero"><h1 id="title">班服家長查詢</h1><p>這個頁面只顯示您孩子家庭的訂購摘要，以及班級匿名尺寸參考。</p></section><div class="card"><div class="note warn">這是家長專屬網址。請不要轉傳給其他家庭；拿到網址的人就能看到本家庭的訂購摘要。</div><div class="updated" id="updated"></div></div><div class="card" id="familyCard"><h2>您家目前登記</h2><div id="familyIntro" class="note good"></div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>類型</th><th>對象</th><th>尺寸</th><th>件數</th><th>單價</th><th>折扣</th><th>小計</th></tr></thead><tbody id="familyBody"></tbody></table></div><div style="margin-top:12px">家庭合計：<span class="total" id="familyTotal">$0</span></div></div><div class="card"><h2>廠商官方尺寸表</h2><div class="tablewrap"><table><thead><tr><th>尺寸</th><th>胸寬 cm</th><th>衣長 cm</th></tr></thead><tbody id="officialBody"></tbody></table></div></div><div class="card"><h2>輸入身高體重，找較接近的班內尺寸</h2><div class="grid"><label><span>身高 cm</span><input id="h" type="number" inputmode="decimal"></label><label><span>體重 kg</span><input id="w" type="number" inputmode="decimal"></label></div><button class="btn" onclick="recommend()">找相近尺寸</button><div id="result" class="result">請先輸入身高與體重。</div></div><div class="card"><h2>班內匿名實穿參考</h2><div class="tablewrap"><table><thead><tr><th>尺寸</th><th>樣本數</th><th>身高範圍</th><th>體重範圍</th><th>穿著感</th></tr></thead><tbody id="refBody"></tbody></table></div><div class="note" style="margin-top:10px">這是班內匿名彙整資料，不會顯示其他學生姓名、座號或個別金額；樣本少時只適合作參考。</div></div></div><script>function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}function money(n){return'$'+Math.round(+n||0).toLocaleString('zh-TW')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}let data={sizes:[],groups:[],family:null};try{const m=location.hash.match(/[#&]d=([^&]+)/);if(m)data=dec(m[1])}catch{}title.textContent=(data.className||'班服')+'｜家長查詢';updated.textContent=data.updated?'資料更新：'+new Date(data.updated).toLocaleString('zh-TW'):'尚未帶入資料';if(data.family){familyIntro.innerHTML=`<b>${esc(data.family.studentNo?'座號 '+data.family.studentNo+' ':'')}${esc(data.family.studentName||'')}</b> 的家庭訂購摘要如下。`;familyBody.innerHTML=(data.family.lines||[]).map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.relation||'')}${x.label?`（${esc(x.label)}）`:''}</td><td>${esc(x.size||'—')}${x.fit?` / ${esc(x.fit)}`:''}</td><td>${x.qty||0}</td><td>${money(x.unitPrice||0)}</td><td>${x.discount?'-'+money(x.discount):'—'}</td><td><b>${money(x.subtotal||0)}</b></td></tr>`).join('');familyTotal.textContent=money(data.family.total||0)}else{familyIntro.textContent='這個網址目前沒有個別家庭訂購資料。';familyBody.innerHTML='<tr><td colspan="7">請向老師索取正確的家長專屬網址。</td></tr>';familyTotal.textContent='$0'}officialBody.innerHTML=(data.sizes&&data.sizes.length)?data.sizes.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.chest||'—')}</td><td>${esc(x.length||'—')}</td></tr>`).join(''):'<tr><td colspan="3">老師尚未輸入廠商尺寸表。</td></tr>';refBody.innerHTML=(data.groups&&data.groups.length)?data.groups.map(g=>`<tr><td><b>${esc(g.size)}</b></td><td>${g.n}</td><td>${g.hmin}–${g.hmax} cm</td><td>${g.wmin}–${g.wmax} kg</td><td>${Object.entries(g.fits||{}).map(([k,v])=>`${esc(k)} ${v}`).join('、')}</td></tr>`).join(''):'<tr><td colspan="5">目前尚未累積足夠的班內實穿資料。</td></tr>';function recommend(){const H=+h.value,W=+w.value,r=document.getElementById('result');if(!H||!W){r.textContent='請先輸入身高與體重。';return}const gs=(data.groups||[]).filter(g=>g.n>0);if(!gs.length){r.textContent='目前還沒有足夠班內量套資料。';return}const ranked=gs.map(g=>({...g,d:Math.sqrt(Math.pow((H-g.havg)/5,2)+Math.pow((W-g.wavg)/5,2))})).sort((a,b)=>a.d-b.d);const a=ranked[0],b=ranked[1];r.innerHTML=`<b>較接近：${esc(a.size)}</b>${b?`<div style="margin-top:4px">次近：${esc(b.size)}</div>`:''}<div style="margin-top:8px;font-size:13px;color:#667589">班內 ${esc(a.size)} 目前有 ${a.n} 筆完整樣本，觀察範圍為 ${a.hmin}–${a.hmax} cm、${a.wmin}–${a.wmax} kg。這是匿名班內經驗，不是廠商官方身高體重推薦。</div>`}</script></body></html>
