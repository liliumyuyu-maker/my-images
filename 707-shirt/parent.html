<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#143a6d">
<title>707 班服訂購確認</title>
<style>
:root{--navy:#143a6d;--ink:#203047;--muted:#6a7789;--line:#d8e3ef;--bg:#f5f8fc;--green:#16745a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 70px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#0d2a50,#19548d 60%,#70a5d5)}h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;opacity:.92;line-height:1.5}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0}.card h2{margin:0 0 10px;color:var(--navy);font-size:20px}.note{padding:10px 12px;border-left:4px solid #76a5d5;border-radius:9px;background:#f1f7fd;font-size:13px;line-height:1.55}.note.good{border-left-color:#68aa91;background:#f3fbf7}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:10px;border-bottom:1px solid #e9eef5;text-align:left;font-size:14px;vertical-align:top}th{background:#eef4fb;color:#244b78}.totalbox{background:#eef6ff;border:1px solid #cfe0f1;border-radius:14px;padding:14px;margin-top:12px}.formula{font-size:15px;line-height:1.6}.total{font-size:32px;font-weight:900;color:var(--navy);margin-top:5px}.updated{text-align:right;color:var(--muted);font-size:11px;margin-top:8px}.empty{padding:20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<section class="hero"><h1>707 班服訂購確認</h1><p>這一頁只顯示您家目前的訂購尺寸、件數與金額計算。</p></section>
<div class="card"><div id="who" class="note good"></div><div class="updated" id="updated"></div></div>
<div class="card"><h2>訂購內容</h2><div class="tablewrap"><table><thead><tr><th>對象</th><th>尺寸</th><th>件數</th><th>單價</th><th>小計</th></tr></thead><tbody id="body"></tbody></table></div><div class="totalbox"><div class="formula" id="formula"></div><div>應付合計</div><div class="total" id="total">$0</div></div></div>
<div class="card"><div class="note">若尺寸或件數需要調整，請直接回覆老師。尺寸參考表會由老師另外提供，不和個別訂購明細混在一起。</div></div>
</div>
<script>
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}function money(n){return '$'+Math.round(+n||0).toLocaleString('zh-TW')}
let data=null;try{const m=location.hash.match(/[#&]d=([^&]+)/);if(m)data=dec(m[1])}catch(e){}
if(!data){document.querySelector('.app').innerHTML='<section class="hero"><h1>707 班服訂購確認</h1></section><div class="card empty">這個網址沒有帶入訂購資料，請向老師索取正確的查詢連結。</div>'}else{const name=data.studentName||'同學',no=data.studentNo||'';document.getElementById('who').innerHTML=`<b>${no?`座號 ${no}　`:''}${name}</b> 的家庭訂購如下。`;document.getElementById('updated').textContent=data.updated?'資料更新：'+new Date(data.updated).toLocaleString('zh-TW'):'';document.getElementById('body').innerHTML=(data.lines||[]).map(x=>`<tr><td>${x.who||''}${x.label?`（${x.label}）`:''}</td><td><b>${x.size||'尺寸待確認'}</b></td><td>${x.qty||1}</td><td>${x.who==='孩子'?'432−45＝387 元':money(x.price||0)}</td><td><b>${money((x.qty||1)*(x.price||0))}</b></td></tr>`).join('');document.getElementById('formula').textContent='計算：'+(data.formula||'');document.getElementById('total').textContent=money(data.total||0)}
</script>
</body></html>
