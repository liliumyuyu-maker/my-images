<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143a6d">
<title>707 班服｜尺寸參考</title>
<style>
:root{--navy:#143a6d;--ink:#203047;--muted:#6a7789;--line:#d8e3ef;--bg:#f5f8fc;--green:#16745a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}.app{max-width:820px;margin:auto;padding:14px 14px 70px}.hero{padding:22px;border-radius:20px;color:#fff;background:linear-gradient(145deg,#0d2a50,#19548d 60%,#70a5d5)}h1{margin:0 0 6px;font-size:27px}.hero p{margin:0;opacity:.9}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0}.card h2{margin:0 0 10px;color:var(--navy);font-size:20px}.note{padding:10px 12px;border-left:4px solid #76a5d5;border-radius:9px;background:#f1f7fd;font-size:13px;line-height:1.55}.note.good{border-left-color:#68aa91;background:#f3fbf7}label span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}input,select{width:100%;min-height:46px;border:1px solid #cbd8e7;border-radius:9px;padding:8px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;min-height:46px;padding:9px 13px;background:var(--navy);color:#fff;font-weight:800;margin-top:10px}.result{padding:14px;border-radius:13px;background:#f5f9fe;border:1px solid #d6e3f1;margin-top:10px;min-height:80px}.result b{font-size:22px;color:var(--navy)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:9px;border-bottom:1px solid #e9eef5;text-align:left;font-size:13px}th{background:#eef4fb;color:#244b78}.updated{text-align:right;color:var(--muted);font-size:11px;margin-top:8px}
</style></head>
<body><div class="app">
<section class="hero"><h1>707 班服｜匿名尺寸參考</h1><p>依班內實際量套紀錄整理。不是廠商官方尺寸表，最後仍請以實際套穿感受為準。</p></section>
<div class="card"><div class="note good">家長加購目前以 <b>452 元 / 件</b>計。此頁只包含匿名彙整，不含學生姓名、座號或個別資料。</div><div class="updated" id="updated"></div></div>
<div class="card"><h2>輸入身高體重，找較接近的班內尺寸</h2><div class="grid"><label><span>身高 cm</span><input id="h" type="number" inputmode="decimal"></label><label><span>體重 kg</span><input id="w" type="number" inputmode="decimal"></label></div><button class="btn" onclick="recommend()">找相近尺寸</button><div id="result" class="result">請先輸入身高與體重。</div></div>
<div class="card"><h2>707 班內量套觀察</h2><div class="tablewrap"><table><thead><tr><th>尺寸</th><th>樣本數</th><th>身高觀察範圍</th><th>體重觀察範圍</th><th>實穿感受</th></tr></thead><tbody id="body"></tbody></table></div><div class="note" style="margin-top:10px">身形比例、肩寬與穿衣習慣都會影響感受；樣本數少時尤其只適合作參考。</div></div>
</div>
<script>
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
let data={groups:[]};try{const m=location.hash.match(/[#&]d=([^&]+)/);if(m)data=dec(m[1])}catch{}
updated.textContent=data.updated?'資料更新：'+new Date(data.updated).toLocaleString('zh-TW'):'尚未帶入量套資料';
body.innerHTML=data.groups?.length?data.groups.map(g=>`<tr><td><b>${g.size}</b></td><td>${g.n}</td><td>${g.hmin}–${g.hmax} cm</td><td>${g.wmin}–${g.wmax} kg</td><td>${Object.entries(g.fits||{}).map(([k,v])=>`${k} ${v}`).join('、')}</td></tr>`).join(''):'<tr><td colspan="5">目前量套資料尚未累積完成，老師更新後會提供新網址。</td></tr>';
function recommend(){const H=+h.value,W=+w.value,r=document.getElementById('result');if(!H||!W){r.textContent='請先輸入身高與體重。';return}const gs=(data.groups||[]).filter(g=>g.n>0);if(!gs.length){r.textContent='目前還沒有足夠班內量套資料。';return}const ranked=gs.map(g=>({...g,d:Math.sqrt(Math.pow((H-g.havg)/5,2)+Math.pow((W-g.wavg)/5,2))})).sort((a,b)=>a.d-b.d);const a=ranked[0],b=ranked[1];r.innerHTML=`<b>較接近：${a.size}</b>${b?`<div style="margin-top:4px">次近：${b.size}</div>`:''}<div style="margin-top:8px;font-size:13px;color:#667589">班內 ${a.size} 目前有 ${a.n} 筆完整樣本，觀察範圍為 ${a.hmin}–${a.hmax} cm、${a.wmin}–${a.wmax} kg。這是匿名班內經驗，不是官方尺寸建議。</div>`}
</script></body></html>
